<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Bar Continuations</title>
<style>
:root{--bg:#fbfaf7;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1db;--accent:#2f5d8a;--chip:#f1efe9;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--panel:#1f1f22;--ink:#ececee;--muted:#a0a0a8;--line:#34343a;--accent:#8fb8e3;--chip:#2a2a2f;--warn:#e0a24a}}
:root[data-theme="dark"]{--bg:#161618;--panel:#1f1f22;--ink:#ececee;--muted:#a0a0a8;--line:#34343a;--accent:#8fb8e3;--chip:#2a2a2f;--warn:#e0a24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 16px 6px;max-width:1200px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.sub a{color:var(--accent)}
nav{max-width:1200px;margin:8px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer}
nav button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;max-width:100%}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.card h3{font-size:15px;margin:0;display:flex;gap:8px;align-items:baseline}
.card h3 .share{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--accent);margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:12px}
.warn{color:var(--warn);font-size:12px}
button.play{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:2px 9px;font:inherit;font-size:12.5px;cursor:pointer}
button.play.on{border-color:var(--accent);color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
details ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.pat{margin-bottom:14px}
.pat h3{font-size:15px;margin:0 0 2px}
.scroll{overflow-x:auto}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>One-bar continuations: clusters and names</h1>
  <div class="sub" id="sub"></div>
</header>
<nav id="tabs">
  <button data-t="prefixes" class="on">Prefixes</button>
  <button data-t="patterns">Naming patterns</button>
  <button data-t="types">Pooled types</button>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
<audio id="au" preload="none"></audio>
<script src="data.js"></script>
<script>
"use strict";
const D = window.OB1, $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = x => x == null ? "–" : Math.round(100 * x) + "%";
const au = $("au");
let playing = null;
function play(btn) {
  const src = btn.dataset.src;
  if (playing === btn) { au.pause(); btn.classList.remove("on"); playing = null; return; }
  if (playing) playing.classList.remove("on");
  au.src = src; au.currentTime = 0; au.play(); btn.classList.add("on"); playing = btn;
}
au.onended = () => { if (playing) playing.classList.remove("on"); playing = null; };
document.body.addEventListener("click", e => { const b = e.target.closest("button.play"); if (b) play(b); });
const pb = (src, label, title) => `<button class="play" data-src="${src}" title="${esc(title || "")}">▶ ${esc(label)}</button>`;

$("sub").innerHTML = `${D.prefixes.length} POP909 prefixes; 512 generated one-bar continuations each (1024 for pop909-839). `
  + `Generator: ${esc(D.model)}. Clusters: rules features within each prefix. Names: ${esc(D.namer)} from deterministic evidence. `
  + `Each ▶ plays the last prefix bar, then the continuation. <a href="../index.html">16-beat explorer</a>`;
$("foot").innerHTML = `Shares are proportions of samples under top-p 0.98 sampling. Chord labels are rule-based estimates (Roman numerals in the prefix's estimated key). `
  + `Choice types: copies a prefix bar = at least half the cluster shares ≥ 50% exact notes with one prefix bar; chord relation = the cluster's most common opening chord vs the prefix. `
  + `Names were not checked by listening; review flags mark wording the automatic checks found questionable. Built ${esc(D.created_at.slice(0, 10))}.`;

// ------------------------------------------------------------ prefixes
let curPid = D.prefixes[0].prefix_id;
function prefixesView() {
  const p = D.prefixes.find(x => x.prefix_id === curPid);
  const opts = D.prefixes.map(x => `<option value="${x.prefix_id}" ${x.prefix_id === curPid ? "selected" : ""}>${esc(x.title)} · ${esc(x.key || "")} · ${x.tempo} bpm (${x.prefix_id})</option>`).join("");
  const r = p.real;
  let h = `<div class="row"><select id="psel">${opts}</select>${pb(p.prefix_clip, "whole prefix")}</div>`
    + `<div class="row small muted">${p.n} samples · ${p.groups.length} rules clusters (effective choices ${p.eff.toFixed(1)}) · largest ${pct(p.dominant)} · rare ${pct(p.rare)} · CLaMP3 ${p.k.clamp3} · AMT ${p.k.amt} clusters</div>`
    + (p.summary ? `<div class="row small">${esc(p.summary)}</div>` : "")
    + (p.names_valid === false ? `<div class="warn">LLM output failed the format check (${esc((p.names_errors || []).join("; "))}); names shown as returned.</div>` : "")
    + `<div class="card" style="margin-top:8px"><div class="row" style="margin:0">${pb(r.clip, "real next bar", r.events)}`
    + `<span class="small">${esc(r.reuse)} · ${esc(r.relation)}${r.chord ? " (" + esc(r.chord) + ")" : ""} · closest cluster ${esc(r.nearest_group || "–")}</span></div></div>`
    + `<div class="grid">`;
  p.groups.forEach((g, i) => {
    h += `<div class="card"><h3><span>${esc(g.name || g.group)}</span><span class="share">${g.group} · ${pct(g.share)}</span></h3>`
      + `<div class="bar" style="width:${Math.max(4, 100 * g.share)}%"></div>`
      + (g.description ? `<div>${esc(g.description)}</div>` : "")
      + `<div class="chips"><span class="chip">${esc(g.reuse)}</span><span class="chip">${esc(g.harmony)} · ${esc(g.relation)}</span>`
      + `<span class="chip">${esc(g.density)}</span><span class="chip">${esc(g.register)}</span><span class="chip">${esc(g.rhythm)}</span>`
      + (g.move_type ? `<span class="chip" title="pooled type, ${pct(g.move_type_purity)} of members">${esc(g.move_type)}</span>` : "") + `</div>`
      + (g.flags.length ? `<div class="warn">review flag: ${g.flags.map(esc).join(" · ")}</div>` : "")
      + `<div class="row">${g.clips.map((c, j) => pb(c, j ? String(j) : "representative")).join("")}</div>`
      + (g.evidence.length ? `<details><summary>evidence cited (${g.evidence.length})</summary><ul>${g.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul></details>` : "")
      + `</div>`;
  });
  return h + `</div>`;
}

// ------------------------------------------------------------ naming patterns
function patternsView() {
  let h = `<p class="small muted">Named clusters from all ${D.prefixes.length} prefixes, grouped by their deterministic choice type. `
    + `“Chord named”: the name or description mentions the cluster's estimated opening chord. “Re-use named”: it mentions repetition or a prefix bar.</p>`;
  D.patterns.forEach(c => {
    h += `<div class="pat card"><h3>${esc(c.reuse)} · ${esc(c.relation)}</h3>`
      + `<div class="small muted">${c.n_clusters} cluster${c.n_clusters > 1 ? "s" : ""} in ${c.n_prefixes} prefix${c.n_prefixes > 1 ? "es" : ""} · chord named ${c.chord_named[0]}/${c.chord_named[1]} · re-use named ${c.reuse_named[0]}/${c.reuse_named[1]} · frequent name words: `
      + c.top_words.map(([w, n]) => `${esc(w)} (${n})`).join(", ") + `</div>`
      + `<details><summary>${c.items.length} name${c.items.length > 1 ? "s" : ""}</summary><div class="scroll"><table><tr><th></th><th>prefix</th><th>share</th><th>chord</th><th>name</th><th>description</th></tr>`
      + c.items.map(x => `<tr><td>${pb(x.clip, "")}</td><td>${esc(x.prefix_id.replace("pop909-", ""))} ${esc(x.group)}</td><td>${pct(x.share)}</td><td>${esc(x.harmony)}</td>`
        + `<td>${esc(x.name || "–")}</td><td class="small muted">${esc(x.description || "")}</td></tr>`).join("")
      + `</table></div></details></div>`;
  });
  return h;
}

// ------------------------------------------------------------ pooled types
function typesView() {
  const s = D.pooled, rs = D.real_summary;
  let h = `<p class="small muted">One clustering of ${s.n_samples} samples pooled from ${s.n_prefixes} prefixes (64 each), using the same prefix-relative rules features. `
    + `The types follow the opening chord's function in the estimated key. Split-half stability rises with k up to the largest k tested (k = ${s.k}, prediction ARI ${(s.stability[s.k] || 0).toFixed(2)}); `
    + `type frequencies do not replicate across halves of the prefixes (r = ${(s.half_share_r || 0).toFixed(2)}); a last-chord reference frame gives a different partition (ARI ${s.variant_ari.toFixed(2)}). `
    + `Real next bars: its type occurs in the prefix's samples for ${rs.present}/${rs.n}, and is the prefix's most common type for ${rs.dominant}/${rs.n}.</p>`
    + `<div class="grid">`;
  D.types.forEach(t => {
    h += `<div class="card"><h3><span>${esc(t.name || t.type)}</span><span class="share">${t.type} · ${pct(t.share)} · ${t.n_prefixes_present} prefixes</span></h3>`
      + `<div class="bar" style="width:${Math.max(4, 300 * t.share)}%"></div>`
      + (t.description ? `<div>${esc(t.description)}</div>` : "")
      + `<div class="chips">${t.chord.map(([c, v]) => `<span class="chip">${esc(c)} ${pct(v)}</span>`).join("")}`
      + t.relation.map(([c, v]) => `<span class="chip">${esc(c)} ${pct(v)}</span>`).join("") + `<span class="chip">copies a bar ${pct(t.copies)}</span></div>`
      + (t.flags.length ? `<div class="warn">review flag: ${t.flags.map(esc).join(" · ")}</div>` : "")
      + `<div class="row">${t.clips.map(c => pb(c.clip, c.prefix_id.replace("pop909-", "").replace(/-win.*/, ""), c.prefix_id)).join("")}</div>`
      + (t.evidence.length ? `<details><summary>evidence cited (${t.evidence.length})</summary><ul>${t.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul></details>` : "")
      + `</div>`;
  });
  return h + `</div>`;
}

let tab = "prefixes";
function render() {
  $("main").innerHTML = tab === "prefixes" ? prefixesView() : tab === "patterns" ? patternsView() : typesView();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const s = $("psel"); if (s) s.onchange = () => { curPid = s.value; render(); };
}
$("tabs").onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; if (playing) { au.pause(); playing = null; } render(); } };
render();
</script>
</body>
</html>
